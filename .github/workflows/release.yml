name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate release tag and notes
        shell: bash
        run: |
          python scripts/prepare_release.py "$RELEASE_TAG" --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret.'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wifi-cloak-signing.keystore"
          test -s "$RUNNER_TEMP/wifi-cloak-signing.keystore"
      - name: Test, lint and build signed APK
        shell: bash
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/wifi-cloak-signing.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK signature and stage assets
        shell: bash
        run: |
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(awk '/Signer #1 certificate SHA-256 digest:/ { print $NF }' "$RUNNER_TEMP/apk-signature.txt")
          expected=$(tr -d '\r\n' < .github/signing-certificate.sha256)
          test "$actual" = "$expected" || { echo 'Signing certificate does not match existing APKs.'; exit 1; }
          python scripts/prepare_release.py "$RELEASE_TAG"
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.tag || github.ref_name }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WiFiCloak-${{ inputs.tag || github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.apk dist/checksums.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist/*.apk dist/checksums.sha256 \
              --verify-tag --draft --title "WiFi Cloak ${RELEASE_TAG#v}" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wifi-cloak-signing.keystore"
